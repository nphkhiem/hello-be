[versions]
agp = "9.3.1"
kotlin = "2.4.10"
ksp = "2.3.10"
spotless = "8.10.0"
ktlint = "1.8.0"

compose-bom = "2026.08.00"
tv-material = "1.1.0"
activity-compose = "1.13.0"
core-ktx = "1.19.0"
lifecycle = "2.11.0"
androidx-hilt = "1.3.0"
kotlinx-serialization = "1.9.0"

hilt = "2.60.1"
room = "2.8.4"
datastore = "1.2.1"
media3 = "1.11.0"
coroutines = "1.11.0"

junit-jupiter = "6.1.3"
junit-platform = "6.1.3"
truth = "1.4.5"
junit4 = "4.13.2"
androidx-test-ext = "1.3.0"
androidx-test-runner = "1.7.0"

[libraries]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradle-plugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidx-hilt" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
