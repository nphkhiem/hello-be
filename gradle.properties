# The C1 JIT on aarch64 cannot encode the OSR entry for this Lint/UAST method
# (assembler_aarch64.hpp:264, "Field too big for insn"), which kills the daemon
# mid-lint on JDK 21.0.1. Excluding it from JIT compilation keeps the daemon alive.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:CompileCommand=exclude,org.jetbrains.uast.kotlin.FirKotlinUastResolveProviderService::getArgumentForParameter
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
